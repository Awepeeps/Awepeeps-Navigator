name: AwepeepsNavigator
version: 1.6.1
main: com.awepeeps.navigator.AwepeepsNavigator
api-version: '1.20'
description: Shared lodestone-marked points of interest directory; vanilla controls compass binding.
softdepend: [BlueMap]
commands:
  navigator:
    description: Open the points of interest menu or manage points.
    usage: /navigator [item [player]|set <name> [group]|remove <name>|clear|spawn <on|off>]
permissions:
  awepeepsnavigator.create:
    description: Create named points of interest.
    default: true
  awepeepsnavigator.admin:
    description: Manage point removals, configured items, and the BlueMap spawn marker.
    default: op
  awepeepsnavigator.view:
    description: View the POI directory.
    default: true
  awepeepsnavigator.bypass:
    description: Bypass Navigator permission checks when permissions.admin-bypass is enabled.
    default: op
